####
# Deploys twr to the production EC2 instance (sa-east-1) on every push to `main`.
#
# Runs on a GitHub-hosted runner. The job assumes the IAM role created in
# infra/terraform/github_oidc.tf and sends infra/ssm-deploy.sh to the instance
# through SSM. That script clones/updates /opt/twr and runs docker compose
# there (ARM build must happen on the box). No self-hosted runner and no
# Administration PAT.
#
# Requires /opt/twr/.env already on the instance (docs/aws.md step 4).
# Requires terraform apply of the GitHub OIDC role before the first run.
####
name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: sa-east-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::471112830628:role/twr-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy over SSM
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote=$(mktemp)
          {
            echo "bash -eo pipefail <<'SSM_DEPLOY'"
            echo "export GH_TOKEN=$(printf %q "$GH_TOKEN")"
            echo "export REPO=$(printf %q "$REPO")"
            echo "export SHA=$(printf %q "$SHA")"
            cat infra/ssm-deploy.sh
            echo "SSM_DEPLOY"
          } > "$remote"

          command_id=$(aws ssm send-command \
            --instance-ids "$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=twr" "Name=instance-state-name,Values=running" \
              --query 'Reservations[0].Instances[0].InstanceId' --output text)" \
            --document-name AWS-RunShellScript \
            --comment "twr deploy ${SHA}" \
            --timeout-seconds 3600 \
            --parameters "$(jq -n --arg script "$(cat "$remote")" '{commands:[$script]}')" \
            --query 'Command.CommandId' --output text)

          echo "SSM command $command_id"
          for _ in $(seq 1 90); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$(aws ec2 describe-instances \
                --filters "Name=tag:Name,Values=twr" "Name=instance-state-name,Values=running" \
                --query 'Reservations[0].Instances[0].InstanceId' --output text)" \
              --query 'Status' --output text)
            echo "status=$status"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$(aws ec2 describe-instances \
                    --filters "Name=tag:Name,Values=twr" "Name=instance-state-name,Values=running" \
                    --query 'Reservations[0].Instances[0].InstanceId' --output text)" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "timed out waiting for SSM command" >&2
          exit 1
